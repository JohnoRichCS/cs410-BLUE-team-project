{% extends "base.html" %}

{% block title %}Faíct - Fact Check{% endblock %}

{% block content %}

<div class="text-center mb-10">
    <h1 class="text-4xl font-extrabold text-slate-900 mb-2">Real-Time Content Verification</h1>
    <p class="text-lg text-slate-600">Instantly analyze text, audio, and video against trusted sources.</p>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
    <div class="flex space-x-4 mb-4 border-b border-slate-200 pb-2">
        <button class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-2">Text / URL</button>
        <button class="text-slate-500 hover:text-slate-700 font-medium pb-2 cursor-not-allowed" disabled>Audio / Video</button>
        <button class="text-slate-500 hover:text-slate-700 font-medium pb-2 cursor-not-allowed" disabled>Image Upload</button>
    </div>
    
    <form method="POST" action="/analyze">
        <textarea 
            name="claim" 
            class="w-full h-32 p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none mb-4" 
            placeholder="Paste a claim, article text, URL, or social media link here to verify..." 
            required></textarea>
        
        <div class="flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
            <div class="text-sm text-slate-500 flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Auto-detects AI-generated content
            </div>
            <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow transition duration-150 ease-in-out">
                Analyze Claim
            </button>
        </div>
    </form>
</div>

{% endblock %}
